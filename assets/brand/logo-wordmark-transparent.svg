<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Israel Shmueli wordmark">

  <defs>
    <style><![CDATA[
      .name { font-family: 'EB Garamond', 'Noto Serif Display', Georgia, serif; font-weight: 400; letter-spacing: 0.18em; }
      .mono { font-family: 'EB Garamond', 'Noto Serif Display', Georgia, serif; font-weight: 400; letter-spacing: -0.03em; }
      .sub { font-family: 'Inter Display', 'Inter', Arial, sans-serif; font-weight: 500; letter-spacing: 0.22em; }
      .micro { font-family: 'Inter Display', 'Inter', Arial, sans-serif; font-weight: 500; letter-spacing: 0.32em; }
    ]]></style>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="900" height="210" fill="transparent"/>
  <text class="name" x="450" y="86" text-anchor="middle" font-size="58" fill="#222321">ISRAEL SHMUELI</text>
  <line x1="190" y1="117" x2="710" y2="117" stroke="#343635" stroke-width="1.2" opacity="0.75"/>
  <line x1="240" y1="128" x2="405" y2="128" stroke="#7E2430" stroke-width="1.7"/>
  <line x1="495" y1="128" x2="660" y2="128" stroke="#7E2430" stroke-width="1.7"/>
  <path d="M450 123 l7 7 l-7 7 l-7 -7 z" fill="transparent" stroke="#7E2430" stroke-width="1.1"/>
  <text class="sub" x="450" y="158" text-anchor="middle" font-size="13" fill="#343635">PRACTICING NOTARY &amp; ATTORNEY AT LAW</text>
